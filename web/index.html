<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Face Score Community</title>
<style>
  :root { --bg:#f7f7fb; --card:#fff; --ink:#1c1c28; --mute:#6b6b7b; --accent:#4f46e5; --line:#e4e4ee; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14141c; --card:#1e1e2a; --ink:#ececf4; --mute:#9a9aae; --line:#2e2e40; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui,sans-serif; }
  main { max-width:560px; margin:0 auto; padding:32px 16px; }
  h1 { font-size:1.6rem; margin:0 0 4px; }
  p.sub { color:var(--mute); margin:0 0 20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px; }
  button { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:10px 18px; font-size:1rem; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  #preview { display:none; width:100%; max-height:320px; object-fit:contain; margin:12px 0; border-radius:8px; }
  #result { margin-top:16px; display:none; }
  .score { font-size:3rem; font-weight:700; color:var(--accent); }
  .bar { height:8px; background:var(--line); border-radius:4px; overflow:hidden; margin:4px 0 12px; }
  .bar > div { height:100%; background:var(--accent); }
  .badge { display:inline-block; font-size:.75rem; padding:2px 8px; border-radius:99px; border:1px solid var(--line); color:var(--mute); }
  .err { color:#dc2626; margin-top:12px; }
  small { color:var(--mute); display:block; margin-top:16px; }
</style>
</head>
<body>
<main>
  <h1>Face Score Community</h1>
  <p class="sub">Free and open source · 开源免费 · 1–5 scale</p>
  <div class="card">
    <input id="file" type="file" accept="image/*">
    <img id="preview" alt="">
    <div><button id="go" disabled>Score / 打分</button> <span id="mode" class="badge"></span></div>
    <div id="error" class="err"></div>
    <div id="result">
      <div class="score"><span id="score">–</span><span style="font-size:1rem;color:var(--mute)"> / 5</span></div>
      <div id="dims"></div>
    </div>
    <small id="notice"></small>
  </div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const file = $('file'), go = $('go');

fetch('/api/info').then(r => r.json()).then(i => {
  $('mode').textContent = i.mode === 'cnn' ? 'CNN model' : 'geometric baseline (no weights)';
  $('notice').textContent = i.notice;
});

file.addEventListener('change', () => {
  const f = file.files[0];
  go.disabled = !f;
  $('result').style.display = 'none';
  $('error').textContent = '';
  if (f) { $('preview').src = URL.createObjectURL(f); $('preview').style.display = 'block'; }
});

go.addEventListener('click', async () => {
  const body = new FormData();
  body.append('file', file.files[0]);
  go.disabled = true;
  $('error').textContent = '';
  try {
    const res = await fetch('/api/score', { method: 'POST', body });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || 'Request failed');
    $('score').textContent = data.score.toFixed(1);
    const dims = $('dims');
    dims.replaceChildren();
    (data.dimensions || []).forEach(d => {
      const row = document.createElement('div');
      row.textContent = d.label + ': ' + d.score.toFixed(0);
      const bar = document.createElement('div'); bar.className = 'bar';
      const fill = document.createElement('div'); fill.style.width = d.score + '%';
      bar.appendChild(fill); dims.append(row, bar);
    });
    $('result').style.display = 'block';
  } catch (e) {
    $('error').textContent = e.message;
  } finally {
    go.disabled = false;
  }
});
</script>
</body>
</html>
